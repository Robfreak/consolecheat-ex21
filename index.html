<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Input-Overlay für Streams · consolecheat</title>
    <meta
      name="description"
      content="Input-Overlay für Streams: zeigt Tasten, Trigger und Sticks deines Controllers live als transparentes Overlay für OBS. Konfiguration nur über die URL, keine Anmeldung. Inoffiziell, nicht von Sony."
    />
    <meta name="theme-color" content="#07090e" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (function () {
        // Overlay view (#mode=overlay or ?overlay): transparent page for OBS, set before any CSS paints.
        var overlay = /(^#|&)mode=overlay(&|$)/.test(location.hash) || /[?&]overlay(=|&|$)/.test(location.search);
        document.documentElement.dataset.mode = overlay ? "overlay" : "config";
        if (overlay) return;
        try {
          var s = localStorage.getItem("consolecheat-theme");
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = t;
          var c = t === "light" ? "#f4f1eb" : "#07090e";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", c);
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
